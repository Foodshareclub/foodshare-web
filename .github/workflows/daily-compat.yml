name: Daily Compatibility & E2E

# Nightly gate for the web layer:
# 1. Quality matrix (oxlint / biome / eslint / tsc / bun unit tests)
# 2. Build + Playwright E2E (4 shards)
# 3. Vendored supabase/ drift check against foodshare-backend main
# 4. Production health probes + cross-repo CI status
# 5. AI test-gap analysis of the last 24h of commits (Groq -> Z.AI fallback)

on:
  schedule:
    - cron: "10 4 * * *" # 04:10 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-compat-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "latest"
  NODE_VERSION: "20"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    env:
      # self-hosted runners lack injected public env; keep env validation off
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://api.foodshare.club
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    name: Quality (${{ matrix.job }})
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        job: [lint, "lint:oxlint", "lint:biome", type-check, test]
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap tools (idempotent)
        run: |
          # Self-hosted runners must survive GitHub billing outages, so
          # nightly jobs provision their own toolchain if missing.
          command -v jq >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jq curl; }
          command -v deno >/dev/null 2>&1 || { curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/deno sh -s -- -y; echo "/opt/deno/bin" >> "$GITHUB_PATH"; } || true
          command -v bun >/dev/null 2>&1 || { curl -fsSL https://bun.sh/install | BUN_INSTALL=/opt/bun bash >/dev/null; echo "/opt/bun/bin" >> "$GITHUB_PATH"; } || true
          command -v cargo >/dev/null 2>&1 || { [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env" && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; } || true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-daily-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # TODO(debt): admin-mock unit tests are env-sensitive on the
      # self-hosted ARM runner (pass on GH-hosted CI, which gates all
      # pushes). Advisory here until root-caused.
      - run: bun run ${{ matrix.job == 'test' && 'test:ci' || matrix.job }}
        continue-on-error: ${{ matrix.job == 'test' }}

  e2e:
    name: Playwright E2E (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: [self-hosted, Linux]
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://api.${{ secrets.SITE_DOMAIN }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: https://${{ secrets.SITE_DOMAIN }}
      NEXT_PUBLIC_SITE_URL: https://${{ secrets.SITE_DOMAIN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || 'https://3467e48f7cb71ccbe4b0e96b0136da1b@o4509901022691328.ingest.de.sentry.io/4511957598797904' }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'foodshare-web' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED }}
      NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED }}
      NEXT_PUBLIC_OAUTH_APPLE_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_APPLE_ENABLED }}
      NEXT_PUBLIC_OAUTH_GITHUB_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_GITHUB_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-daily-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build production bundle
        run: bun run build

      - name: Run Playwright shard
        run: bunx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 7

  compat-matrix:
    name: Compatibility matrix (drift + health + CI)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Foodshareclub/foodshare-backend
          path: backend
          token: ${{ secrets.CROSS_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Foodshareclub/foodshare-tools
          path: tools
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Run compat checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO: remove once org GitHub Actions billing is fixed
          IGNORE_CI_FAIL: Foodshareclub/foodshare-app Foodshareclub/foodshare-tools
          WEB_DIR: ${{ github.workspace }}
          BACKEND_DIR: ${{ github.workspace }}/backend
        run: bash "$GITHUB_WORKSPACE/tools/scripts/compat-check.sh"

  ai-test-gap:
    name: AI test-gap analysis (24h commits)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Foodshareclub/foodshare-tools/.github/actions/ai-review@main
        with:
          mode: test-gap
          since: "24 hours"
