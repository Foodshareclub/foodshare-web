name: Extract Secrets
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract from VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "ANON_KEY:"
            grep "^ANON_KEY=" /home/organic/dev/foodshare-backend/.env | cut -d= -f2- | tr -d '"' | base64 -w 0
            echo ""
            echo "SERVICE_ROLE_KEY:"
            grep "^SERVICE_ROLE_KEY=" /home/organic/dev/foodshare-backend/.env | cut -d= -f2- | tr -d '"' | base64 -w 0
            echo ""
