name: VPS Maintenance

on:
  schedule:
    - cron: "0 3 * * 0" # Run at 3 AM every Sunday
  workflow_dispatch:
    inputs:
      fix_runner:
        description: "Fix runner and restart backend"
        type: boolean
        required: false
        default: false
      upgrade_packages:
        description: "Upgrade system packages"
        type: boolean
        required: false
        default: false
      debug_services:
        description: "Dump docker logs for unhealthy services"
        type: boolean
        required: false
        default: false
      check_runner_health:
        description: "Diagnose runner (OOM, disk, status)"
        type: boolean
        required: false
        default: false

jobs:
  maintenance:
    name: VPS Maintenance
    runs-on: self-hosted
    steps:
      - name: Perform Maintenance via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RUNNER_ACCESS_TOKEN: ${{ secrets.RUNNER_ACCESS_TOKEN }}
          FIX_RUNNER: ${{ github.event.inputs.fix_runner }}
          UPGRADE_PACKAGES: ${{ github.event.inputs.upgrade_packages }}
          DEBUG_SERVICES: ${{ github.event.inputs.debug_services }}
          CHECK_RUNNER_HEALTH: ${{ github.event.inputs.check_runner_health }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          trap 'rm -f ~/.ssh/vps_key' EXIT

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vps_key "organic@${VPS_HOST}" \
            "RUNNER_ACCESS_TOKEN='$RUNNER_ACCESS_TOKEN' FIX_RUNNER='$FIX_RUNNER' UPGRADE_PACKAGES='$UPGRADE_PACKAGES' DEBUG_SERVICES='$DEBUG_SERVICES' CHECK_RUNNER_HEALTH='$CHECK_RUNNER_HEALTH' EVENT_NAME='$EVENT_NAME' bash -s" << 'REMOTE_EOF'
          set -e

          echo "=== Health Checks ==="
          df -h && free -m && uptime

          # Always refresh the runner ORG_ACCESS_TOKEN from the passed-in secret
          if [ -n "$RUNNER_ACCESS_TOKEN" ]; then
            echo "=== Refreshing runner ORG_ACCESS_TOKEN ==="
            sed -i "s|^ORG_ACCESS_TOKEN=.*|ORG_ACCESS_TOKEN=$RUNNER_ACCESS_TOKEN|" /home/organic/dev/foodshare-runner/.env
            echo "✅ ORG_ACCESS_TOKEN updated"
          fi

          # Ensure both VPSes use the same unified alert channel (one topic to subscribe to)
          if ! grep -qs '^WATCHDOG_ALERT_CMD=.*foodshare-infra-alerts' /home/organic/dev/foodshare-runner/.env; then
            echo "=== Standardising watchdog alert channel ==="
            sed -i 's|^WATCHDOG_ALERT_CMD=.*|WATCHDOG_ALERT_CMD=curl -fsS -d "$WATCHDOG_MSG" https://ntfy.sh/foodshare-infra-alerts|' \
              /home/organic/dev/foodshare-runner/.env || \
            echo 'WATCHDOG_ALERT_CMD=curl -fsS -d "$WATCHDOG_MSG" https://ntfy.sh/foodshare-infra-alerts' >> \
              /home/organic/dev/foodshare-runner/.env
            echo "✅ Alert channel unified -> ntfy.sh/foodshare-infra-alerts"
          fi

          # --- Weekly scheduled tasks ---
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "=== Weekly: Disk Cleanup (safe — no volume prune) ==="
            # Remove accumulated build caches from runner _work dirs
            find /home/organic/actions-runner/_work -maxdepth 4 \
              \( -name ".next" -o -name "node_modules" \) \
              -type d -exec rm -rf {} + 2>/dev/null || true
            # Safe prune: only exited containers, dangling images, and build cache.
            # NO --volumes flag — that nukes anonymous volumes from stopped stateful
            # containers (e.g. Supabase postgres if it restarts mid-window).
            docker container prune -f --filter until=168h 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            docker builder prune -f 2>/dev/null || true
            echo "Disk after cleanup:"
            df -h /
          fi

          # --- Runner health diagnostics (manual or scheduled) ---
          if [ "$CHECK_RUNNER_HEALTH" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "=== Runner Health: OOM check ==="
            sudo dmesg | grep -i "killed process\|oom" | tail -20 || echo "No OOM events found"

            echo "=== Runner Health: Container status ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}' | grep -i runner || echo "No runner containers found"

            echo "=== Runner Health: Container restart/OOM counts ==="
            for cname in vps-github-runner frontend-github-runner; do
              docker inspect "$cname" 2>/dev/null \
                | python3 -c "import sys,json; c=json.load(sys.stdin)[0]; s=c['State']; print('$cname: restarts=' + str(c['RestartCount']) + ' status=' + s['Status'] + ' oom_killed=' + str(s['OOMKilled']))" \
                2>/dev/null || true
            done

            echo "=== Runner Health: Watchdog timer ==="
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            systemctl --user status foodshare-runner-watchdog.timer --no-pager -l 2>/dev/null || echo "Watchdog timer not installed"

            echo "=== Runner Health: Last watchdog pass ==="
            tail -5 /var/tmp/foodshare-runner-watchdog/watchdog.log 2>/dev/null || echo "No watchdog log"

            echo "=== Runner Health: Disk usage ==="
            df -h /
            du -sh /home/organic/actions-runner/_work/ 2>/dev/null || true
          fi

          # Debug Services
          if [ "$DEBUG_SERVICES" = "true" ]; then
            echo "=== Docker Container Status ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'
            echo "=== Recent runner logs ==="
            for cname in vps-github-runner frontend-github-runner; do
              echo "--- $cname ---"
              docker logs "$cname" --tail=20 2>&1 || true
            done
          fi

          # Package Upgrades
          if [ "$UPGRADE_PACKAGES" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "=== Upgrading Packages ==="
            sudo apt-get update && sudo apt-get upgrade -y && sudo apt-get autoremove -y
          fi

          # Fix Runner & Restart
          if [ "$FIX_RUNNER" = "true" ]; then
            echo "=== Restarting Runner ==="
            cd /home/organic/dev/foodshare-runner

            docker compose --profile org down || true
            docker rm -f vps-github-runner frontend-github-runner 2>/dev/null || true
            docker compose --profile org up -d
            sleep 8
            docker logs vps-github-runner --tail=20 2>&1 || \
              docker logs frontend-github-runner --tail=20 2>&1 || true

            echo "=== Post-restart container inspect ==="
            for cname in vps-github-runner frontend-github-runner; do
              docker inspect "$cname" 2>/dev/null \
                | python3 -c "import sys,json; c=json.load(sys.stdin)[0]; s=c['State']; print('$cname: restarts=' + str(c['RestartCount']) + ' status=' + s['Status'] + ' oom_killed=' + str(s['OOMKilled']))" \
                2>/dev/null || true
            done
            echo "Done."
          fi
          REMOTE_EOF
