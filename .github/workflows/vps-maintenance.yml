name: VPS Maintenance

on:
  schedule:
    - cron: "0 3 * * 0" # Run at 3 AM every Sunday
  workflow_dispatch:
    inputs:
      fix_runner:
        description: "Fix runner and restart backend"
        type: boolean
        required: false
        default: false
      upgrade_packages:
        description: "Upgrade system packages"
        type: boolean
        required: false
        default: false
      debug_services:
        description: "Dump docker logs for unhealthy services"
        type: boolean
        required: false
        default: false

jobs:
  maintenance:
    name: VPS Maintenance
    runs-on: self-hosted
    steps:
      - name: Perform Maintenance via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          RUNNER_ACCESS_TOKEN: ${{ secrets.RUNNER_ACCESS_TOKEN }}
          FIX_RUNNER: ${{ github.event.inputs.fix_runner }}
          UPGRADE_PACKAGES: ${{ github.event.inputs.upgrade_packages }}
          DEBUG_SERVICES: ${{ github.event.inputs.debug_services }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          trap 'rm -f ~/.ssh/vps_key' EXIT

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/vps_key "organic@${VPS_HOST}" \
            "RUNNER_ACCESS_TOKEN='$RUNNER_ACCESS_TOKEN' FIX_RUNNER='$FIX_RUNNER' UPGRADE_PACKAGES='$UPGRADE_PACKAGES' DEBUG_SERVICES='$DEBUG_SERVICES' EVENT_NAME='$EVENT_NAME' bash -s" << 'REMOTE_EOF'
          set -e

          echo "=== Health Checks ==="
          df -h && free -m && uptime

          # Always refresh the runner ORG_ACCESS_TOKEN from the passed-in secret
          if [ -n "$RUNNER_ACCESS_TOKEN" ]; then
            echo "=== Refreshing runner ORG_ACCESS_TOKEN ==="
            sed -i "s|^ORG_ACCESS_TOKEN=.*|ORG_ACCESS_TOKEN=$RUNNER_ACCESS_TOKEN|" /home/organic/dev/foodshare-runner/.env
            echo "✅ ORG_ACCESS_TOKEN updated"
          fi

          # Debug Services
          if [ "$DEBUG_SERVICES" = "true" ]; then
            echo "=== Docker Container Status ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
          fi

          # Package Upgrades
          if [ "$UPGRADE_PACKAGES" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "=== Upgrading Packages ==="
            sudo apt-get update && sudo apt-get upgrade -y && sudo apt-get autoremove -y
          fi

          # Fix Runner & Restart
          if [ "$FIX_RUNNER" = "true" ]; then
            echo "=== Restarting Runner ==="
            cd /home/organic/dev/foodshare-runner
            docker compose --profile org down || true
            docker rm -f frontend-github-runner 2>/dev/null || true
            docker compose --profile org up -d
            sleep 8
            docker logs frontend-github-runner --tail=10 2>&1 || true
            echo "Done."
          fi
          REMOTE_EOF
