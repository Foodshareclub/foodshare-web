name: CI/CD

on:
  push:
    branches: [main, develop, organic]
  pull_request:
    branches: [main, develop, organic]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.job }}
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        job: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4
      
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - if: matrix.job == 'lint'
        run: |
          deno fmt --check
          deno lint
      
      - if: matrix.job == 'type-check'
        run: deno check supabase/functions/**/*.ts
      
      - if: matrix.job == 'test'
        run: |
          deno test --allow-all --coverage=coverage
          deno coverage coverage --lcov --output=coverage.lcov
      
      - if: matrix.job == 'test'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov

  security-scan:
    name: Security Scan
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, ARM64]
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - run: |
          cd /home/organic/dev/foodshare-backend
          git fetch origin main
          git reset --hard origin/main
          docker compose restart functions
          echo "✓ Deployed"
