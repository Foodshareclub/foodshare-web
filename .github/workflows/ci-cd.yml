name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - run: deno fmt --check
      - run: deno lint

  type-check:
    name: Type Check
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - run: deno check supabase/functions/**/*.ts

  test:
    name: Test
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - run: deno test --allow-all --coverage=coverage
      
      - name: Generate coverage
        run: deno coverage coverage --lcov --output=coverage.lcov
      
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.lcov

  security-scan:
    name: Security Scan
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  deploy:
    name: Deploy Edge Functions
    runs-on: [self-hosted, Linux, ARM64]
    needs: [lint, type-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Deploy to Supabase
        run: |
          # Deploy edge functions using local Supabase instance
          cd /home/organic/dev/foodshare-backend
          
          # Pull latest changes
          git fetch origin main
          git reset --hard origin/main
          
          # Restart Supabase services to pick up function changes
          docker compose restart functions
          
          echo "✓ Edge functions deployed"
