name: CI/CD

on:
  push:
    branches: [main, develop, organic]
  pull_request:
    branches: [main, develop, organic]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BUN_VERSION: "1.3.9"

jobs:
  # Combined validation job - runs lint, type-check, test in parallel
  validate:
    name: Validate (${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        if: matrix.job == 'lint'
        run: bun audit || true

      - name: Run ${{ matrix.job }}
        run: bun run ${{ matrix.job == 'lint' && 'lint' || matrix.job == 'type-check' && 'type-check' || 'test:ci' }}

      - name: Upload coverage
        if: matrix.job == 'test'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    outputs:
      build-artifact: build-output
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED }}
          NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED }}
          NEXT_PUBLIC_OAUTH_APPLE_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_APPLE_ENABLED }}
          NEXT_PUBLIC_OAUTH_GITHUB_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_GITHUB_ENABLED }}

      - name: Tar build output
        run: tar -cvf build-output.tar .next public messages package.json bun.lock

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar
          retention-days: 1

      - name: Check Bundle Size Budget
        run: bun scripts/check-bundle-size.ts

  e2e:
    name: E2E (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Untar build output
        run: tar -xvf build-output.tar

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps
      
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps

      - name: Verify build output
        run: |
          echo "Checking .next build output..."
          ls -la .next/ || echo "ERROR: .next directory not found!"
          ls -la .next/BUILD_ID 2>/dev/null && echo "Build ID: $(cat .next/BUILD_ID)" || echo "WARNING: No BUILD_ID found"
          echo "Server routes:"
          ls .next/server/ 2>/dev/null | head -10 || echo "No server directory"

      - name: Run Playwright tests
        run: bun run e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          SKIP_ENV_VALIDATION: "true"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 14

  merge-e2e-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install playwright
        run: bun add -d @playwright/test

      - name: Download blob reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        if: hashFiles('all-blob-reports/**') != ''
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED=${{ secrets.NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED }}
            NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED=${{ secrets.NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED }}
            NEXT_PUBLIC_OAUTH_APPLE_ENABLED=${{ secrets.NEXT_PUBLIC_OAUTH_APPLE_ENABLED }}
            NEXT_PUBLIC_OAUTH_GITHUB_ENABLED=${{ secrets.NEXT_PUBLIC_OAUTH_GITHUB_ENABLED }}

  sync-translations:
    name: Sync Translations
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: bun-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync translations
        run: bun run translations:sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy:
    name: Deploy
    runs-on: [self-hosted, Linux, X64]
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    concurrency:
      group: production_deploy
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          CADDY_EMAIL: ${{ secrets.CADDY_ACME_EMAIL }}
          OAUTH_GOOGLE_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED }}
          OAUTH_FACEBOOK_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED }}
          OAUTH_APPLE_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_APPLE_ENABLED }}
          OAUTH_GITHUB_ENABLED: ${{ secrets.NEXT_PUBLIC_OAUTH_GITHUB_ENABLED }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          REPO_LOWER=$(echo "$GITHUB_REPO" | tr '[:upper:]' '[:lower:]')
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          # Build .env.production locally using printf (avoids heredoc indentation issues)
          printf '%s\n' \
            "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" \
            "SITE_DOMAIN=${SITE_DOMAIN}" \
            "CADDY_ACME_EMAIL=${CADDY_EMAIL}" \
            "NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED=${OAUTH_GOOGLE_ENABLED}" \
            "NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED=${OAUTH_FACEBOOK_ENABLED}" \
            "NEXT_PUBLIC_OAUTH_APPLE_ENABLED=${OAUTH_APPLE_ENABLED}" \
            "NEXT_PUBLIC_OAUTH_GITHUB_ENABLED=${OAUTH_GITHUB_ENABLED}" \
            > /tmp/.env.production

          # Transfer .env.production to VPS
          $SCP_CMD /tmp/.env.production "$SSH_USER@$SSH_HOST:$VPS_DEPLOY_PATH/.env.production"

          # Deploy on VPS
          $SSH_CMD "$SSH_USER@$SSH_HOST" "cd $VPS_DEPLOY_PATH && \
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git && \
            git fetch origin main && \
            git reset --hard origin/main && \
            ([ -f ../foodshare-backend/.env.functions ] && grep -E '^[A-Za-z0-9_]+=' ../foodshare-backend/.env.functions >> .env.production || true) && \
            (docker ps | grep -q supabase-db && docker exec supabase-db psql -U postgres -d postgres -A -t -c \"SELECT name || '=' || secret FROM vault.decrypted_secrets;\" >> .env.production 2>/dev/null || true) && \
            echo ${GITHUB_TOKEN} | docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin && \
            docker pull ghcr.io/${REPO_LOWER}:latest && \
            docker compose --env-file .env.production up -d --force-recreate && \
            echo 'Deploy complete'"

          rm -f ~/.ssh/deploy_key /tmp/.env.production
