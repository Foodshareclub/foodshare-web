services:
  foodshare-web:
    container_name: foodshare-web
    image: ghcr.io/foodshareclub/foodshare-web:latest
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NEXT_PUBLIC_APPLE_CLIENT_ID=club.foodshare.web
    restart: unless-stopped
    labels:
      - autoheal=true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 100
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

  cloudflared:
    container_name: foodshare-cloudflared-web
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    labels:
      - autoheal=true
    command: tunnel --metrics 0.0.0.0:2000 run
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

networks:
  foodshare-web-network:
