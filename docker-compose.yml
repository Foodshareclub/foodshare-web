services:
  foodshare-web:
    container_name: foodshare-web
    image: ${FOODSHARE_WEB_IMAGE:-ghcr.io/foodshareclub/foodshare-web:latest}
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NEXT_PUBLIC_APPLE_CLIENT_ID=${NEXT_PUBLIC_APPLE_CLIENT_ID:-club.foodshare.web}
    restart: unless-stopped
    labels:
      - autoheal=true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # /api/ready, not /api/health. /api/health probes PostgREST, GoTrue,
    # storage and Upstash — four round trips every 20 seconds — and a single
    # slow Upstash reply (the route allows 3s) marks the container unhealthy,
    # so autoheal restarts the entire app. The full-page HEAD render on top of
    # that made it worse. /api/ready is constant and prerendered; the deep
    # probe still exists at /api/health for monitoring to scrape slowly.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 100
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

  cloudflared:
    container_name: foodshare-cloudflared-web
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    labels:
      - autoheal=true
    command: tunnel --metrics 0.0.0.0:2000 run
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

networks:
  foodshare-web-network:
