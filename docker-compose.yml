services:
  foodshare-web:
    container_name: foodshare-web
    image: ghcr.io/foodshareclub/foodshare-web:latest
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NEXT_PUBLIC_APPLE_CLIENT_ID=club.foodshare.web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 100
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

  cloudflared:
    container_name: foodshare-cloudflared-web
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --metrics 0.0.0.0:2000 run
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2000/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      foodshare-web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

  autoheal:
    container_name: foodshare-autoheal-web
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  foodshare-web-network:
