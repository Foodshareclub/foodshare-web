services:
  foodshare-web:
    container_name: foodshare-web
    image: ghcr.io/foodshareclub/foodshare-web:latest
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 100
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - supabase-network

networks:
  supabase-network:
    external: true
    name: supabase-network
