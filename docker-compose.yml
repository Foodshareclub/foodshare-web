services:
  foodshare-web:
    container_name: foodshare-web
    image: ghcr.io/foodshareclub/foodshare-web:latest
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NEXT_PUBLIC_APPLE_CLIENT_ID=club.foodshare.web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    volumes:
      - ./routes-manifest-patch.json:/app/.next/routes-manifest.json:ro
      - ./apple-auth-patch.js:/app/.next/server/chunks/ssr/[root-of-the-server]__fa3e9c1a._.js:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 100
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

  cloudflared:
    container_name: supabase-cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      foodshare-web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - foodshare-web-network

networks:
  foodshare-web-network:
