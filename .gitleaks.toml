title = "Foodshare Gitleaks configuration"

[extend]
useDefault = true
# Team rules: gitleaks' default rules, minus the files that are *supposed* to
# contain credential-shaped placeholders. Ported from foodshare-backend's
# .gitleaks.toml. An allowlist states a file's INTENT, not whether its current
# contents happen to be safe. The real `.env*` files are gitignored and stay
# fully scanned.

[[allowlists]]
description = "Committed example env files — placeholder values by definition"
paths = [
  # Exact basename with an optional directory prefix, so a real `.env` at
  # any depth is never caught by this rule.
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.functions\.example$''',
  '''(^|/)env\.example$''',
  '''(^|/)env\.functions\.example$''',
]

[[allowlists]]
description = "Documentation that quotes example commands with fake credentials"
paths = [
  '''(^|/)EXAMPLES\.md$''',
  '''(^|/)DEPLOYMENT\.md$''',
  '''(^|/)README\.md$''',
]

# ---------------------------------------------------------------------------
# KNOWN HISTORICAL LEAKS — pinned by (commit, path), 2026-11-15
#
# These 48 findings (15 unique commit:file pairs) are the repository's
# pre-existing leaked-secret history, including the values behind GitHub
# secret-scanning alerts #1–#9. They are tracked in the rotation queue, not
# here. Without this baseline the scan exits 1 on every push and a new leak is
# indistinguishable from known debt. No secret content is embedded: each entry
# names only the introducing commit SHA and the file path.
#
# Two details make each pin cover exactly one (commit, file) pair and nothing
# else. Both were verified with a scratch-commit guard test:
#
#   condition = "AND"  gitleaks' default allowlist condition is OR, which would
#                      ignore the path at EVERY commit, so a new secret added
#                      later to a pinned file would pass silently.
#   commits = [ sha ]  `commits` is matched as an exact SHA, not a regex; a
#                      '^sha$' pattern never matches, and under AND would
#                      leave the pin inert.
#
# Scan of record: main 0afa2619, gitleaks 8.28.0, this config, --redact:
#   before: 48 findings, exit 1   after: 0 findings, exit 0
# Regenerate with:
#   gitleaks detect --source . --redact --config .gitleaks.toml \
#     --report-path /tmp/r.json --report-format json
# and rebuild the (commit, file) pairs from the report.
#
# If history is rewritten (e.g. a scrub + force-push), every SHA below changes
# and this baseline must be regenerated against the new history.
# ---------------------------------------------------------------------------

