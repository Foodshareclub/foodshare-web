# ---------------------------------------------------------------------------
# KNOWN HISTORICAL LEAKS - pinned by (commit, path), 2026-11-15, rev 2026-11-21
#
# These findings are the repository's pre-existing leaked-secret history:
# 21 unique (commit, file) pairs under the default rule set - the values
# behind the GitHub secret-scanning alerts, plus the fixture-class
# findings in committed documentation (re-pinned per commit, above). They
# are tracked in the rotation queue, not here. Without this baseline the
# scan exits 1 on every push and a new leak is indistinguishable from known
# debt. 21 of the 24 allowlist entries below name only the introducing
# commit SHA and the file path - no secret content embedded (the three
# f2-pin-* entries are the documented carve-out, see below).
#
# COVERAGE OF GITHUB SECRET-SCANNING ALERTS #1-#9 (precise statement per
# lead ruling c1301 on t_f7d1f23b, extended by the review verdict c1332):
#   #1 (AWS secret) and #4/#6 (Twilio Account SIDs): covered by the two
#     local team rules below - the default rule set is structurally blind
#     to both classes - AND the 3 historical values are value-pinned
#     (the f2-pin-* entries).
#   #2/#5/#7/#8: covered by the default rule set and pinned above.
#   #3/#9 (Supabase service keys): absent from reachable history (verified
#     2026-11-19/21 by full-ref gitleaks scan + pickaxe over all refs);
#     covered by the default jwt rule on re-introduction.
#
# HELD BASELINE - live Brevo key (lead ruling 2026-11-17 on t_99d5e5ba):
# fingerprint 1f2732c16d92 is deliberately NOT baselined, and no allowlist
# entry below covers it. Verified 2026-11-19 (t_13e7ba88) and re-verified
# 2026-11-21 (t_9d41a3cb): that value is ABSENT from this repository's
# history - full-ref gitleaks scan, git pickaxe over all refs, and
# base64-variant decode of every finding all negative. It exists only in
# operator-side staging (t_5f77c879, revocation still open). If it ever
# enters this history the gate flags it. There is no sendinblue/Brevo
# class suppression.
#
# The Brevo key that IS in this history (GitHub secret-scanning alert #7)
# is a DIFFERENT value: fingerprint 077e34be20bc, vendor-probed DEAD
# (HTTP 401) at 2026-11-16T20:26:56Z (t_5f77c879 probe record). Its two
# pins below are historical-dead pins, retained per t_13e7ba88: "all
# non-live historical findings should be pinned to zero". The fingerprint
# attribution discrepancy vs the lead ruling (which named 1f2732c16d92 as
# the in-history key) is resolved: the NO-OP close of t_9d41a3cb was
# approved 2026-11-21 after three value-level verifications.
#
# F2 VALUE-PIN CARVE-OUT (lead binding correction c1330 on t_a1f9aacb;
# approved t_b3249e09): the three f2-pin-* entries carry the EXACT
# (regex-escaped) historical values as regexTarget="secret" regexes. Those
# values are already public in this public repository's history and proven
# inert (aws secret: exposed key pair deactivated 2026-11-21, t_48912444/
# t_f7fb4b33; twilio SIDs: test-account class, alert #4/#6). The pins are
# value-scoped, not class suppression - any OTHER aws secret or twilio SID
# of the same class is still flagged by the team rules below.
#
# Two details make each (commit, path) pin cover exactly one (commit, file)
# pair and nothing else. Both were verified with a scratch-commit guard
# test:
#
#   condition = "AND"  gitleaks' default allowlist condition is OR, which would
#                      ignore the path at EVERY commit, so a new secret added
#                      later to a pinned file would pass silently.
#   commits = [ sha ]  `commits` is matched as an exact SHA, not a regex; a
#                      '^sha$' pattern never matches, and under AND would
#                      leave the pin inert.
#
# Scan of record (gitleaks 8.28.0, release tarball sha256 d942f3ad1472...,
# binary sha256 5588b5d942df...; measured 2026-11-21 on branch tip
# 2f1597bc, t_99d5e5ba run 974):
#   Surfaces:
#     branch   = single-branch clone of this branch, plain detect
#                (1013 commits)
#     all-refs = all branch tips + tags + refs/pull/207/merge fetched,
#                detect --log-opts=--all (1286 commits at 2f1597bc; the CI
#                parity surface - CI scans the PR merge ref, whose history
#                advances with each push)
#   Baseline (default rules only, no allowlists):
#     before: 80 findings / 21 pairs, exit 1 - identical pair set on both
#     surfaces
#   Baseline + the two team rules below:
#     83 findings / 21 pairs, exit 1 - exactly +3, all at
#     815115d:scripts/archive-firebase/restore-secrets.sh (L122, L129, L136)
#   This config:
#     after: 0 findings, exit 0 - both surfaces
# Regenerate with:
#   gitleaks detect --source . --redact --config .gitleaks.toml \
#     --report-path /tmp/r.json --report-format json
# and rebuild the (commit, file) pairs from the report.
#
# If history is rewritten (e.g. a scrub + force-push), every SHA below
# changes and this baseline must be regenerated against the new history.
# ---------------------------------------------------------------------------


