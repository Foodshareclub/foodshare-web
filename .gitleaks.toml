# ---------------------------------------------------------------------------
# F2 VALUE PINS - exact historical values newly detected by the two team
# rules at 815115d:scripts/archive-firebase/restore-secrets.sh. The pair is
# already (commit, path)-pinned above; these value-scoped pins are the
# approved belt-and-braces record (lead binding correction c1330) and make
# each pinned value independently accountable. Carve-out rationale in the
# header above (already-public, proven-inert values).
# ---------------------------------------------------------------------------

[[allowlists]]
description = "f2-pin-aws-secret-815115d8: exact historical value, already public + proven inert (fp fb946305f9b3; alert #1; scripts/archive-firebase/restore-secrets.sh L122)"
regexTarget = "secret"
regexes = ['^\+rBDknmyieo6nmDF8QhpoM2q0XlJELILM4N28Hgg$']

[[allowlists]]
description = "f2-pin-twilio-sid-815115d8: exact historical value, already public + proven inert (fp 0a0ec4008fac; alert #4; scripts/archive-firebase/restore-secrets.sh L129)"
regexTarget = "secret"
regexes = ['^ACffdce5ff52463cc83772beac07ac37c8$']

[[allowlists]]
description = "f2-pin-twilio-test-sid-815115d8: exact historical value, already public + proven inert (fp fadadf80857d; alert #6; scripts/archive-firebase/restore-secrets.sh L136)"
regexTarget = "secret"
regexes = ['^ACac1a815f34a8f66742eba8e2fdf90e1b$']
[[rules]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key (keyword-context, 40-char base64 charset)"
regex = '''(?i)aws.{0,20}secret.{0,20}?[:=]\s*['"]?([A-Za-z0-9/+=]{40})(?:['"]|[^A-Za-z0-9/+=]|$)'''
keywords = ["aws"]
secretGroup = 1

[[rules]]
id = "twilio-account-sid"
description = "Twilio Account SID (AC + 32 lowercase hex, keyword-context)"
regex = '''(?i)twilio.{0,40}?[^0-9A-Za-z](AC[0-9a-f]{32})(?:[^0-9a-f]|$)'''
keywords = ["twilio"]
secretGroup = 1
