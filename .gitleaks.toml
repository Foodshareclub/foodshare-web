title = "Foodshare Gitleaks configuration"

[extend]
useDefault = true
# Detection = the gitleaks built-in default rules (the same useDefault
# umbrella as the foodshare-backend gate) PLUS two local team rules at the
# bottom of this file: aws-secret-access-key and twilio-account-sid. They
# close the default rule set's structural gaps for this repo's own leaked
# classes (alerts #1, #4, #6) - the default generic-api-key charset rejects
# /+ in a 40-char aws secret, and the default twilio rule is SK-only (never
# matches AC SIDs). Local rules only: no remote config fetch. The rules are
# owed a mirror in the backend config (t_81e23c4a) so the two configs do not
# diverge (lead ruling c1301, t_f7d1f23b; approved t_b3249e09).
#
# An allowlist entry states a file's INTENT at a specific commit, not
# whether its current contents happen to be safe. The real `.env*` files are
# gitignored and stay fully scanned.

# Fixture-class findings in committed documentation (previously baselined by
# a path-only allowlist, which suppressed them at EVERY commit - the F1
# bypass of the security review t_0c920f78). Re-pinned per (commit, path),
# condition=AND, per the approved spec (t_a1f9aacb): a fresh value in any of
# these files at a NEW commit is still detected. All five verified
# fixture-class (fake placeholder credentials / stub PEM),
# mutation-verified 2026-11-19 (t_a1f9aacb) and re-verified 2026-11-21
# (t_99d5e5ba run 974 probe table).

[[allowlists]]
description = "fixture-class placeholder, curl-auth-header @ 815115d:docs/03-features/email/README.md"
condition = "AND"
commits = [ "815115d85558062aff46e17c3eca2ce781a41ed1" ]
paths = [ '^docs/03\-features/email/README\.md$' ]

