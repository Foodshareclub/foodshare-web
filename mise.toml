# Toolchain pinned for this repository.
#
# Bun is the only runtime: package manager, script runner, TypeScript
# executor, type checker, test runner and the Next.js server runtime.
# `bun scripts/check-no-node.ts` fails the build if Node creeps back in.
#
# The *exact* build is pinned in three places, and all three have to
# name the same one:
#
#   mise.toml                 ->  "npm:bun" = "<version>"
#   package.json              ->  "packageManager": "bun@<version>"
#   .github/workflows/*.yml   ->  BUN_VERSION: "<version>"
#
# The version is the newest release `oven-sh/setup-bun` can install in CI.
# That action downloads from the GitHub *releases*, and the canary builds
# are published to npm only — there is no `bun-v<canary>` release to
# download. A canary therefore pins CI to a build it cannot fetch, and
# every job fails at the setup step before it runs anything.
#
# So the pin is a release, and it is the same one CI installs: a version
# that exists only on one developer's machine cannot be installed there,
# and pinning to it makes local and CI run different binaries.
#
# Keep all three in step when the version is refreshed.
[tools]
"npm:bun" = "1.4.3"
